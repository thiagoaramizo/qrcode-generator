<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f0f0f;
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 8rem;
            font-weight: 200;
            margin: 0;
            color: #ffffff;
            opacity: 0.8;
            letter-spacing: -2px;
            line-height: 1;
        }
        p {
            font-size: 1.2rem;
            margin: 1.5rem 0 2.5rem;
            color: #a0a0a0;
            font-weight: 300;
        }
        a {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #333;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        a:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>The page you are looking for is lost in the void.</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
