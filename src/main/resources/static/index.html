<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCode Generator API</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0f0f0f;
            color: #e0e0e0;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 200;
            margin-bottom: 1rem;
            color: #ffffff;
            letter-spacing: -1px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #a0a0a0;
            margin-bottom: 2rem;
            font-weight: 300;
        }
        .pix-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: rgba(75, 184, 169, 0.1);
            border: 1px solid rgba(75, 184, 169, 0.2);
            border-radius: 50px;
            margin-bottom: 2.5rem;
            transition: transform 0.2s ease;
        }
        .pix-badge:hover {
            transform: translateY(-2px);
            background: rgba(75, 184, 169, 0.15);
        }
        .pix-badge svg {
            width: 28px;
            height: 28px;
        }
        .pix-badge .content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .pix-badge strong {
            color: #4BB8A9;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .pix-badge span {
            color: #a0a0a0;
            font-size: 0.8rem;
        }
        .code-block {
            background-color: #1a1a1a;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #333;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', 'Droid Sans Mono', 'Source Code Pro', monospace;
            font-size: 0.9rem;
            color: #4caf50;
            margin-bottom: 2rem;
            overflow-x: auto;
            text-align: left;
        }
        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 0.8rem;
            display: block;
            text-align: left;
        }
        a.button {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #333;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        a.button:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GeraQR - QR Code Generator</h1>
        <p>A simple and minimalist API to generate QR Codes on the fly.</p>
        
        <div class="pix-badge">
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <g fill="#4BB8A9" fill-rule="evenodd">
                    <path d="M112.57 391.19c20.056 0 38.928-7.808 53.12-22l76.693-76.692c5.385-5.404 14.765-5.384 20.15 0l76.989 76.989c14.191 14.172 33.045 21.98 53.12 21.98h15.098l-97.138 97.139c-30.326 30.344-79.505 30.344-109.85 0l-97.415-97.416h9.232zm280.068-271.294c-20.056 0-38.929 7.809-53.12 22l-76.97 76.99c-5.551 5.53-14.6 5.568-20.15-.02l-76.711-76.693c-14.192-14.191-33.046-21.999-53.12-21.999h-9.234l97.416-97.416c30.344-30.344 79.523-30.344 109.867 0l97.138 97.138h-15.116z"/>
                    <path d="M22.758 200.753l58.024-58.024h31.787c13.84 0 27.384 5.605 37.172 15.394l76.694 76.693c7.178 7.179 16.596 10.768 26.033 10.768 9.417 0 18.854-3.59 26.014-10.75l76.989-76.99c9.787-9.787 23.331-15.393 37.171-15.393h37.654l58.3 58.302c30.343 30.344 30.343 79.523 0 109.867l-58.3 58.303H392.64c-13.84 0-27.384-5.605-37.171-15.394l-76.97-76.99c-13.914-13.894-38.172-13.894-52.066.02l-76.694 76.674c-9.788 9.788-23.332 15.413-37.172 15.413H80.782L22.758 310.62c-30.344-30.345-30.344-79.524 0-109.868"/>
                </g>
            </svg>
            <div class="content">
                <strong>PIX Compatible</strong>
                <span>Supports "Copia e Cola" mode</span>
            </div>
        </div>

        <span class="label">Usage Example</span>
        <div class="code-block">
            GET https://geraqr.com/generate?content=A_PIX_KEY
        </div>

        <br>
        <a href="https://github.com/thiagoaramizo/qrcode-generator" class="button" target="_blank">View on GitHub</a>
    </div>
</body>
</html>
